<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ITI Sachin - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        linear-gradient(135deg,#061b3a,#0b4da2,#0878c9);
    overflow:hidden;
}

/* Background circles */

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    animation:float 7s infinite ease-in-out;
}

.circle1{
    width:300px;
    height:300px;
    top:-100px;
    left:-100px;
}

.circle2{
    width:250px;
    height:250px;
    bottom:-80px;
    right:-70px;
    animation-delay:2s;
}

.circle3{
    width:120px;
    height:120px;
    top:20%;
    right:15%;
    animation-delay:4s;
}

@keyframes float{

    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-25px);
    }
}

/* Login box */

.login-container{
    width:92%;
    max-width:430px;
    background:rgba(255,255,255,0.97);
    border-radius:25px;
    padding:35px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
    position:relative;
    z-index:5;
    animation:loginBox 1s ease;
}

@keyframes loginBox{

    from{
        opacity:0;
        transform:translateY(50px) scale(.9);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* Logo */

.logo{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,#0b3d91,#0b8de3);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:27px;
    font-weight:bold;
    box-shadow:0 8px 25px rgba(11,61,145,.4);
}

.title{
    text-align:center;
    margin-top:18px;
}

.title h1{
    color:#0b3d91;
    font-size:30px;
}

.title h2{
    color:#333;
    font-size:18px;
    margin-top:5px;
}

.title p{
    color:#777;
    font-size:13px;
    margin-top:7px;
}

/* Input */

.input-box{
    margin-top:22px;
}

.input-box label{
    display:block;
    font-weight:bold;
    color:#333;
    margin-bottom:7px;
}

.input-box input{
    width:100%;
    height:50px;
    border:1px solid #d5dce5;
    border-radius:12px;
    padding:0 15px;
    font-size:16px;
    outline:none;
    transition:.3s;
    background:#f8fafc;
}

.input-box input:focus{
    border-color:#0b65c2;
    background:white;
    box-shadow:0 0 0 3px rgba(11,101,194,.12);
}

/* Password */

.password-box{
    position:relative;
}

.password-box input{
    padding-right:55px;
}

.show-password{
    position:absolute;
    right:15px;
    top:38px;
    cursor:pointer;
    color:#0b3d91;
    font-size:20px;
}

/* Login button */

.login-btn{
    width:100%;
    height:52px;
    margin-top:25px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#0b3d91,#0878d1);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(11,61,145,.35);
}

.login-btn:active{
    transform:scale(.98);
}

/* Error */

.error{
    text-align:center;
    color:#e32626;
    font-weight:bold;
    margin-top:12px;
    min-height:20px;
}

/* Info */

.info{
    margin-top:20px;
    background:#eef6ff;
    border-left:4px solid #0b65c2;
    padding:12px;
    border-radius:8px;
    font-size:13px;
    color:#31506e;
}

.info b{
    color:#0b3d91;
}

/* Footer */

.footer{
    text-align:center;
    margin-top:20px;
    color:#888;
    font-size:12px;
}

/* Mobile */

@media(max-width:500px){

    .login-container{
        padding:28px 22px;
    }

    .logo{
        width:78px;
        height:78px;
        font-size:23px;
    }

    .title h1{
        font-size:26px;
    }

}

</style>
</head>

<body>

<!-- Background -->

<div class="circle circle1"></div>
<div class="circle circle2"></div>
<div class="circle circle3"></div>


<!-- Login -->

<div class="login-container">

    <div class="logo">
        ITI
    </div>

    <div class="title">

        <h1>ITI SACHIN</h1>

        <h2>Government ITI Sachin</h2>

        <p>Welcome to ITI Sachin (Women)</p>

    </div>


    <form onsubmit="loginUser(event)">

        <!-- Username -->

        <div class="input-box">

            <label>Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter Username"
                autocomplete="username"
                required
            >

        </div>


        <!-- Password -->

        <div class="input-box password-box">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                autocomplete="current-password"
                required
            >

            <span
                class="show-password"
                onclick="showPassword()"
                id="eye">
                👁️
            </span>

        </div>


        <!-- Error -->

        <div
            class="error"
            id="error">
        </div>


        <!-- Login -->

        <button
            type="submit"
            class="login-btn">

            🔐 LOGIN

        </button>

    </form>


    <!-- Login information -->

    <div class="info">

        <b>Demo Login Details</b><br><br>

        Username: <b>Sachiniti</b><br>

        Password: <b>iti2026</b>

    </div>


    <div class="footer">

        © 2026 ITI Sachin • All Rights Reserved

    </div>

</div>


<script>

/* LOGIN */

function loginUser(event){

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");


    /*
       Fixed username and password
    */

    if(
        username === "Sachiniti" &&
        password === "iti2026"
    ){

        /*
           Save login
        */

        sessionStorage.setItem(
            "itiLoggedIn",
            "yes"
        );


        /*
           Open Home Page
        */

        window.location.href =
            "home.html";

    }

    else{

        error.innerHTML =
            "❌ Username અથવા Password ખોટો છે.";

    }

}


/* SHOW / HIDE PASSWORD */

function showPassword(){

    const password =
        document.getElementById("password");

    const eye =
        document.getElementById("eye");


    if(password.type === "password"){

        password.type = "text";

        eye.innerHTML = "🙈";

    }

    else{

        password.type = "password";

        eye.innerHTML = "👁️";

    }

}


/*
   Enter key also works
*/

document
.getElementById("password")
.addEventListener("keypress",function(e){

    if(e.key === "Enter"){

        document.querySelector("form").requestSubmit();

    }

});

</script>

</body>
</html>
